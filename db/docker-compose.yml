services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: voter
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: voting
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voter -d voting"]
      interval: 5s
      retries: 5

  app:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: