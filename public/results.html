<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Results</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header><img id="logo" alt=""><h1 id="election-title">Live Results</h1></header>
  <main>
    <div id="turnout" class="card"></div>
    <section class="card">
      <h2>Party totals</h2>
      <p class="muted">Party totals sum member candidates' votes across all positions; a voter may contribute one vote per position.</p>
      <div id="partyResults"></div>
    </section>
    <div id="charts"></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/results.js"></script>
</body>
</html>
